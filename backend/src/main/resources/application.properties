server.port=8080
# Default profile = "h2" (in-memory, zero setup). Use: -Dspring.profiles.active=mysql for MySQL.
spring.profiles.default=h2

spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null

app.jwt.secret=${JWT_SECRET:foodie-capstone-super-secret-key-change-me-in-production-0123456789}
app.jwt.expiration-ms=86400000

springdoc.swagger-ui.path=/swagger-ui.html
